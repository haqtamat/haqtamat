<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haqtamat Customer - Cloud Only</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px} .card{background:#1e293b;padding:15px;border-radius:12px;max-width:500px;margin:10px auto} input{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:none;font-size:15px;box-sizing:border-box} button{width:100%;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin:5px 0} .red{background:#dc2626}.blue{background:#2563eb}.light{background:#334155} .hidden{display:none}</style>
</head><body>
<div class="card" id="loginCard"><h2>HAQTAMAT SARAFI</h2><p>Customer Login - CLOUD ONLY</p><div id="status">Connecting...</div>
<input id="c1" placeholder="Account e.g. 123001001" inputmode="numeric"><input id="c2" type="password" placeholder="PIN" inputmode="numeric"><button onclick="doLogin()">LOGIN</button><div id="errC"></div></div>

<div class="card hidden" id="custCard"><h2 id="custName"></h2><h1 id="custBal"></h1><p id="custKhata"></p>
<input id="toKhata" placeholder="To Account" inputmode="numeric"><input id="trAmt" placeholder="Amount PKR" type="number"><input id="trNote" placeholder="Note">
<button onclick="doTransfer()">SEND - 0.05% Fee</button><div id="feePreview">Enter amount to see fee</div>
<button class="blue" onclick="showStmt()">SHOW MY STATEMENT</button><button class="light" onclick="doChangePin()">CHANGE PIN</button><input id="newPinC" placeholder="New PIN" inputmode="numeric">
<div id="stmtOut"></div><button class="red" onclick="location.reload()">LOGOUT</button></div>

<script>
const DB="https://haqtamat-default-rtdb.firebaseio.com";
let CUR=null;
function to9(s){s=String(s||'').replace(/[^0-9]/g,''); if(s.length===10&&s.startsWith('0'))s=s.slice(1); if(s.length===12&&s.startsWith('92'))s=s.slice(2); return s;}
function fmt(n){return Number(n||0).toLocaleString('en-US')}
function calcFee(a){return Math.max(1,Math.round(a*0.0005))}
async function getOne(k){let r=await fetch(DB+"/"+to9(k)+".json"); return await r.json();}
async function putOne(c){await fetch(DB+"/"+c.khata+".json",{method:"PUT",body:JSON.stringify(c)});}
async function test(){try{let r=await fetch(DB+"/.json"); let j=await r.json(); document.getElementById('status').innerText="CLOUD CONNECTED - "+(j?Object.keys(j).length:0)+" accounts";}catch(e){document.getElementById('status').innerText="Cloud Error "+e.message;}}
test();
document.getElementById('trAmt').addEventListener('input',()=>{let a=Number(document.getElementById('trAmt').value); if(!a){document.getElementById('feePreview').innerText='Enter amount to see fee';return;} let f=calcFee(a); document.getElementById('feePreview').innerText='Amount '+fmt(a)+' + Fee '+fmt(f)+' = Deduct '+fmt(a+f);});
async function doLogin(){
  let a=to9(document.getElementById('c1').value), p=document.getElementById('c2').value.trim();
  let c=await getOne(a); if(!c){document.getElementById('errC').innerText='Account not found in Cloud: '+a;return;}
  if(String(c.pin)!==String(p)){document.getElementById('errC').innerText='Wrong PIN';return;}
  CUR=c; document.getElementById('loginCard').classList.add('hidden'); document.getElementById('custCard').classList.remove('hidden');
  document.getElementById('custName').innerText='Hello '+c.name; document.getElementById('custBal').innerText=fmt(c.bal)+' PKR'; document.getElementById('custKhata').innerText='Account: '+c.khata;
}
async function doTransfer(){
  let to=to9(document.getElementById('toKhata').value), amt=Number(document.getElementById('trAmt').value), note=document.getElementById('trNote').value.trim();
  if(!to||!amt){alert('Enter To + Amount');return;}
  let sender=await getOne(CUR.khata); let dest=await getOne(to);
  if(!dest){alert('To Account not found: '+to);return;} if(sender.khata===dest.khata){alert('Cannot send to self');return;}
  let fee=calcFee(amt), total=amt+fee; if(sender.bal<total){alert('Need '+fmt(total)+' have '+fmt(sender.bal));return;}
  sender.bal-=total; sender.fees=(sender.fees||0)+fee; dest.bal+=amt;
  let ref='HQM-'+Date.now().toString().slice(-8), dt=new Date().toLocaleString();
  sender.tx=sender.tx||[]; dest.tx=dest.tx||[];
  sender.tx.push({d:dt,type:'OUT->'+dest.khata+' Ref:'+ref+' Note:'+note,amt:amt,fee:fee,total:total,to:dest.khata});
  dest.tx.push({d:dt,type:'IN<-'+sender.khata+' Ref:'+ref+' Note:'+note,amt:amt,fee:0,from:sender.khata});
  await putOne(sender); await putOne(dest); CUR=sender;
  document.getElementById('custBal').innerText=fmt(CUR.bal)+' PKR';
  alert('Sent '+fmt(amt)+' + Fee '+fmt(fee)+' = Deduct '+fmt(total)+' Ref '+ref);
}
async function showStmt(){
  let c=await getOne(CUR.khata); CUR=c; document.getElementById('custBal').innerText=fmt(c.bal)+' PKR';
  let h="<b>Statement - "+c.name+"</b><br>Balance: <b>"+fmt(c.bal)+" PKR</b><hr>";
  (c.tx||[]).slice().reverse().forEach(t=>{h+="<div>"+t.d+" - "+t.type+" - "+fmt(t.amt)+" Fee "+fmt(t.fee||0)+"</div>";});
  document.getElementById('stmtOut').innerHTML=h;
}
async function doChangePin(){
  let np=document.getElementById('newPinC').value.trim(); if(np.length<4){alert('PIN 4 digits');return;}
  let c=await getOne(CUR.khata); c.pin=np; await putOne(c); CUR=c; alert('PIN Changed in Cloud to '+np);
}
</script></body></html>
