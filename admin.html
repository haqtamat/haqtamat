<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haqtamat Admin - Cloud Only</title>
<style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:15px} .card{background:#1e293b;padding:15px;border-radius:12px;max-width:500px;margin:10px auto} input,select{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:none;font-size:15px;box-sizing:border-box} button{width:100%;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin:5px 0} .red{background:#dc2626}.blue{background:#2563eb}.light{background:#334155} .hidden{display:none} .row{display:flex;gap:8px} .row button{flex:1} small{color:#94a3b8}</style>
</head><body>
<div class="card" id="loginCard"><h2>HAQTAMAT SARAFI - ADMIN</h2><div id="status">Connecting...</div>
<input id="f1" value="ADMIN"><input id="f2" type="password" placeholder="PIN 1234"><button onclick="doLogin()">LOGIN</button></div>

<div class="card hidden" id="adminCard">
<h2>Admin Dashboard - <span id="cloudBadge">CLOUD</span></h2>
<div id="tot">Loading...</div>
<div class="row"><button onclick="show('dash')">Dashboard</button><button class="blue" onclick="show('create')">Create</button><button class="blue" onclick="show('money')">Money</button></div>
<div class="row"><button class="light" onclick="show('list')">All Accounts</button><button class="light" onclick="show('stmt')">Statement</button><button class="red" onclick="show('rev')">Reverse</button></div>

<div id="dashSec"><h3>Totals</h3><div id="totals"></div><button onclick="loadAll()">REFRESH FROM CLOUD</button></div>

<div id="createSec" class="hidden"><h3>Create Khata</h3>
<input id="newKhata" placeholder="Khata e.g. 123001002" inputmode="numeric">
<input id="newName" placeholder="Full Name"><input id="newFather" placeholder="Father Name">
<input id="newPhone" placeholder="Phone"><input id="newCnic" placeholder="CNIC"><input id="newAddr" placeholder="Address">
<input id="newPin" placeholder="PIN 1234" inputmode="numeric">
<button onclick="createCust()">CREATE IN CLOUD</button><div id="okA"></div></div>

<div id="moneySec" class="hidden"><h3>Add / Send Money</h3>
<input id="mKhata" placeholder="Khata" inputmode="numeric">
<input id="mAmt" placeholder="Amount PKR" type="number">
<input id="mNote" placeholder="Note">
<button onclick="doAdd()">ADD MONEY (IN)</button>
<button class="red" onclick="doOut()">SEND MONEY (OUT - with 0.05% fee)</button><div id="okM"></div></div>

<div id="listSec" class="hidden"><h3>All Accounts</h3><div id="list"></div></div>

<div id="stmtSec" class="hidden"><h3>Statement</h3>
<input id="sKhata" placeholder="Khata" inputmode="numeric"><button class="blue" onclick="showStmt()">SHOW STATEMENT</button><div id="stmtOut"></div></div>

<div id="revSec" class="hidden"><h3>Reverse by Ref</h3>
<input id="rKhata" placeholder="Khata" inputmode="numeric"><input id="rRef" placeholder="Ref e.g. HQM-12345678"><button class="red" onclick="doReverse()">REVERSE</button><div id="revOut"></div></div>

<div id="editSec" class="hidden"><h3>Edit Khata</h3><input id="eKhata" placeholder="Khata" inputmode="numeric">
<input id="eName" placeholder="Name"><input id="ePhone" placeholder="Phone"><input id="ePin" placeholder="New PIN">
<input id="eBal" placeholder="Balance" type="number"><button onclick="saveEdit()">SAVE EDIT TO CLOUD</button><div id="okE"></div></div>
</div>

<script>
const DB="https://haqtamat-default-rtdb.firebaseio.com";
let ALL=[];
function to9(s){s=String(s||'').replace(/[^0-9]/g,''); if(s.length===10&&s.startsWith('0'))s=s.slice(1); if(s.length===12&&s.startsWith('92'))s=s.slice(2); return s;}
function fmt(n){return Number(n||0).toLocaleString('en-US')}
function calcFee(a){return Math.max(1,Math.round(a*0.0005))}
async function getOne(k){let r=await fetch(DB+"/"+to9(k)+".json"); return await r.json();}
async function putOne(c){let r=await fetch(DB+"/"+c.khata+".json",{method:"PUT",body:JSON.stringify(c)}); return r.ok;}
async function delOne(k){await fetch(DB+"/"+to9(k)+".json",{method:"DELETE"});}
async function loadAll(){
  let r=await fetch(DB+"/.json"); let j=await r.json()||{};
  ALL=Object.values(j).filter(c=>c&&c.khata&&c.name);
  document.getElementById('status').innerText="CLOUD CONNECTED - "+ALL.length+" accounts";
  document.getElementById('tot').innerText=ALL.length+" accounts in Cloud";
  let cash=ALL.reduce((s,c)=>s+Number(c.bal||0),0), fees=ALL.reduce((s,c)=>s+Number(c.fees||0),0);
  document.getElementById('totals').innerHTML="Customers: <b>"+ALL.length+"</b><br>Total Cash: <b>"+fmt(cash)+" PKR</b><br>Total Fees: <b>"+fmt(fees)+" PKR</b>";
  document.getElementById('list').innerHTML=ALL.map((c,i)=>"<div style='padding:10px 0;border-bottom:1px solid #334155'><b>"+c.khata+"</b> - "+c.name+" - PIN "+c.pin+"<br>Bal: <b>"+fmt(c.bal)+" PKR</b> Fees: "+fmt(c.fees)+"<br><div class='row'><button class='blue' onclick=\"viewStmt('"+c.khata+"')\">STATEMENT</button><button class='light' onclick=\"editLoad('"+c.khata+"')\">EDIT</button><button class='red' onclick=\"delCust('"+c.khata+"')\">DELETE</button></div></div>").join('');
  return ALL;
}
function show(s){['dashSec','createSec','moneySec','listSec','stmtSec','revSec','editSec'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.getElementById(s+'Sec').classList.remove('hidden'); if(s==='dash'||s==='list') loadAll();}
async function doLogin(){let a=document.getElementById('f1').value.trim().toLowerCase(),p=document.getElementById('f2').value.trim(); if(a==='admin'&&(p==='1234'||p==='12345')){document.getElementById('loginCard').classList.add('hidden'); document.getElementById('adminCard').classList.remove('hidden'); await loadAll();} else alert('Wrong PIN');}
async function createCust(){
  let khata=to9(document.getElementById('newKhata').value); let name=document.getElementById('newName').value.trim();
  if(!khata||!name){alert('Enter Khata + Name');return;}
  let ex=await getOne(khata); if(ex){alert('Khata already exists in Cloud');return;}
  let c={khata:khata,name:name,father:document.getElementById('newFather').value.trim(),phone:document.getElementById('newPhone').value.trim(),cnic:document.getElementById('newCnic').value.trim(),address:document.getElementById('newAddr').value.trim(),pin:document.getElementById('newPin').value.trim()||'1234',bal:0,fees:0,tx:[]};
  await putOne(c); document.getElementById('okA').innerText="Created "+khata+" in CLOUD"; await loadAll();
  document.getElementById('newKhata').value=''; document.getElementById('newName').value='';
}
async function doAdd(){
  let k=to9(document.getElementById('mKhata').value), amt=Number(document.getElementById('mAmt').value), note=document.getElementById('mNote').value.trim();
  let c=await getOne(k); if(!c){alert('Not found');return;} if(!amt){alert('Amount');return;}
  c.bal+=amt; let ref='HQM-'+Date.now().toString().slice(-8); c.tx=c.tx||[]; c.tx.push({d:new Date().toLocaleString(),type:'ADD Ref:'+ref+' Note:'+note,amt:amt,fee:0});
  await putOne(c); document.getElementById('okM').innerText="Added "+fmt(amt)+" to "+k+" - New Bal "+fmt(c.bal); await loadAll();
}
async function doOut(){
  let k=to9(document.getElementById('mKhata').value), amt=Number(document.getElementById('mAmt').value), note=document.getElementById('mNote').value.trim();
  let c=await getOne(k); if(!c){alert('Not found');return;} if(!amt){alert('Amount');return;}
  let fee=calcFee(amt), total=amt+fee; if(c.bal<total){alert('Insufficient. Need '+fmt(total));return;}
  c.bal-=total; c.fees=(c.fees||0)+fee; let ref='HQM-'+Date.now().toString().slice(-8); c.tx=c.tx||[]; c.tx.push({d:new Date().toLocaleString(),type:'ADMIN OUT Ref:'+ref+' Note:'+note,amt:amt,fee:fee,total:total});
  await putOne(c); document.getElementById('okM').innerText="Sent "+fmt(amt)+" Fee "+fmt(fee)+" New Bal "+fmt(c.bal); await loadAll();
}
async function showStmt(){
  let k=to9(document.getElementById('sKhata').value); let c=await getOne(k); if(!c){alert('Not found');return;}
  let bal=c.bal; let html="<b>"+c.name+" ("+c.khata+")</b><br>Balance: <b>"+fmt(bal)+" PKR</b><hr>";
  (c.tx||[]).slice().reverse().forEach(t=>{html+="<div>"+t.d+" - "+t.type+" - "+fmt(t.amt)+" PKR Fee "+fmt(t.fee||0)+"</div>";});
  document.getElementById('stmtOut').innerHTML=html;
}
function viewStmt(k){document.getElementById('sKhata').value=k; show('stmt'); showStmt();}
async function delCust(k){if(!confirm('Delete '+k+' from CLOUD?'))return; await delOne(k); await loadAll();}
function editLoad(k){let c=ALL.find(x=>x.khata===k); if(!c)return; document.getElementById('eKhata').value=c.khata; document.getElementById('eName').value=c.name; document.getElementById('ePhone').value=c.phone||''; document.getElementById('ePin').value=c.pin; document.getElementById('eBal').value=c.bal; show('edit');}
async function saveEdit(){
  let k=to9(document.getElementById('eKhata').value); let c=await getOne(k); if(!c){alert('Not found');return;}
  c.name=document.getElementById('eName').value.trim()||c.name; c.phone=document.getElementById('ePhone').value.trim();
  let np=document.getElementById('ePin').value.trim(); if(np)c.pin=np;
  let nb=document.getElementById('eBal').value.trim(); if(nb!=='')c.bal=Number(nb);
  await putOne(c); document.getElementById('okE').innerText="Saved "+k+" to Cloud"; await loadAll();
}
async function doReverse(){
  let k=to9(document.getElementById('rKhata').value), ref=document.getElementById('rRef').value.trim();
  let c=await getOne(k); if(!c){alert('Not found');return;}
  let found=(c.tx||[]).find(t=>String(t.type).includes(ref)); if(!found){alert('Ref not found');return;}
  if((c.tx||[]).some(t=>String(t.type).includes('Reversal of')&&String(t.type).includes(ref))){alert('Already reversed');return;}
  let isOut=/OUT|ADMIN/.test(found.type.toUpperCase());
  if(isOut){c.bal+=Number(found.total||found.amt); if(found.fee)c.fees=Math.max(0,(c.fees||0)-Number(found.fee)); c.tx.push({d:new Date().toLocaleString(),type:'REVERSED IN Ref:'+ref+' Note:Reversal of OUT '+fmt(found.amt),amt:found.amt,fee:-Number(found.fee||0)});}
  else{c.bal-=Number(found.amt); c.tx.push({d:new Date().toLocaleString(),type:'REVERSED OUT Ref:'+ref+' Note:Reversal of IN '+fmt(found.amt),amt:found.amt,fee:0});}
  await putOne(c); document.getElementById('revOut').innerText="Reversed OK. New Bal "+fmt(c.bal); await loadAll();
}
loadAll();
</script></body></html>
