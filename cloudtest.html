<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haqtamat Cloud Test</title>
<style>
body{font-family:sans-serif;background:#0f1115;color:#fff;padding:20px}
.card{background:#1a1d24;padding:20px;border-radius:12px;max-width:400px;margin:auto;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px;box-sizing:border-box}
button{width:100%;padding:12px;background:#22c55e;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:5px}
#status{font-size:13px;margin:10px 0;color:#fbbf24;text-align:center}
</style>
</head>
<body>
<div class="card">
<h2>HAQTAMAT - CLOUD ONLY TEST</h2>
<div id="status">Testing cloud...</div>
<h3>1. CREATE KHATA (Admin)</h3>
<input id="newKhata" placeholder="Khata e.g. 123001001" inputmode="numeric">
<input id="newName" placeholder="Name e.g. Test Ali">
<input id="newPin" placeholder="PIN e.g. 1234" inputmode="numeric">
<button onclick="createKhata()">CREATE IN CLOUD</button>
<div id="createResult"></div>
<hr>
<h3>2. CUSTOMER LOGIN</h3>
<input id="acc" placeholder="Account e.g. 123001001" inputmode="numeric">
<input id="pin" placeholder="PIN" type="password" inputmode="numeric">
<button onclick="login()">LOGIN FROM CLOUD</button>
<div id="result"></div>
</div>
<script>
const DB = "https://haqtamat-default-rtdb.firebaseio.com";
async function test(){
  try{
    let r = await fetch(DB + "/.json");
    let j = await r.json();
    document.getElementById('status').innerText = "CLOUD CONNECTED - " + (j ? Object.keys(j).length : 0) + " keys in Firebase";
    document.getElementById('status').style.color = "#22c55e";
  }catch(e){
    document.getElementById('status').innerText = "Cloud Error: " + e.message;
  }
}
test();
async function createKhata(){
  const khata = document.getElementById('newKhata').value.trim();
  const name = document.getElementById('newName').value.trim();
  const pin = document.getElementById('newPin').value.trim() || "1234";
  const out = document.getElementById('createResult');
  if(!khata || !name){ out.innerHTML = "Enter Khata + Name"; return; }
  out.innerHTML = "Saving to Cloud...";
  const data = {khata: khata, name: name, pin: pin, bal: 0, fees: 0, tx: []};
  try{
    let r = await fetch(DB + "/" + khata + ".json", {method: "PUT", body: JSON.stringify(data)});
    if(!r.ok) throw new Error("HTTP " + r.status);
    out.innerHTML = "SAVED TO CLOUD: " + khata + " - " + name + "<br>Now check Firebase, it must appear there. Then try Login below.";
    test();
  }catch(e){ out.innerHTML = "Save Failed: " + e.message; }
}
async function login(){
  const acc = document.getElementById('acc').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const res = document.getElementById('result');
  if(!acc || !pin){ res.innerHTML = "Enter account + PIN"; return; }
  res.innerHTML = "Checking cloud...";
  try{
    let r = await fetch(DB + "/" + acc + ".json");
    let d = await r.json();
    if(!d){ res.innerHTML = "Account not found in Cloud: " + acc + "<br>It means Create did NOT save to root."; return; }
    if(String(d.pin) !== String(pin)){ res.innerHTML = "Wrong PIN"; return; }
    res.innerHTML = "<h3>Hello " + d.name + "</h3><h1>" + Number(d.bal || 0).toLocaleString() + " PKR</h1><p>Account: " + acc + " - FROM CLOUD ONLY</p>";
  }catch(e){ res.innerHTML = "Cloud Error: " + e.message; }
}
</script>
</body>
</html>
